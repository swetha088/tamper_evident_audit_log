spring:
  application:
    name: tamper-evident-audit-log
  datasource:
    url: jdbc:h2:file:./data/audit-log;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
server:
  error:
    include-message: never

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${AUDIT_DB_URL}
    username: ${AUDIT_DB_USERNAME}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
