spring:
  application:
    name: tamper-evident-audit-log
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:./data/audit-log;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
server:
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html

audit:
  retention:
    default-window: P90D
