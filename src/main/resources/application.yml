spring:
  application:
    name: tamper-evident-audit-log
  profiles:
    default: local
    group:
      performance: local
  datasource:
    url: jdbc:h2:file:./data/audit-log;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
server:
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html

audit:
  integrity:
    checkpoint-key: local-development-checkpoint-key-not-for-production
    key-id: local-v1
  performance:
    enabled: false
    event-count: 1000
  retention:
    default-window: P90D
    scheduler:
      enabled: false
