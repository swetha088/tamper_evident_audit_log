spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${AUDIT_DB_URL}
    username: ${AUDIT_DB_USERNAME}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

audit:
  security:
    username: ${AUDIT_SECURITY_USERNAME}
    password: ${AUDIT_SECURITY_PASSWORD}
