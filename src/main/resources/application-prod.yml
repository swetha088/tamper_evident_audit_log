spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${AUDIT_DB_URL}
    username: ${AUDIT_DB_USERNAME}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

audit:
  integrity:
    checkpoint-key: ${AUDIT_INTEGRITY_CHECKPOINT_KEY}
    key-id: ${AUDIT_INTEGRITY_KEY_ID:prod-v1}
  security:
    username: ${AUDIT_SECURITY_USERNAME}
    password: ${AUDIT_SECURITY_PASSWORD}
    roles: ${AUDIT_SECURITY_ROLES:AUDIT_READER,AUDIT_WRITER,AUDIT_PRIVACY_ADMIN,AUDIT_RETENTION_ADMIN}
  retention:
    scheduler:
      enabled: ${AUDIT_RETENTION_SCHEDULER_ENABLED:true}
      cron: ${AUDIT_RETENTION_SCHEDULER_CRON:0 0 * * * *}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
