openapi: 3.1.0
info:
  title: Tamper-Evident Audit Log API
  version: 0.1.0
  description: Prototype API. The local profile permits access; the production profile requires HTTP Basic authentication.
servers:
  - url: http://localhost:8080
paths:
  /audit/events:
    post:
      summary: Append an immutable audit event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendEventRequest' }
      responses:
        '201': { description: Stored event, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEvent' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
    get:
      summary: Query events with deterministic cursor pagination
      parameters:
        - { $ref: '#/components/parameters/actorId' }
        - { $ref: '#/components/parameters/resourceType' }
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/eventType' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Event page, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
  /audit/verify:
    get:
      summary: Verify every record in chain sequence order
      responses:
        '200': { description: Integrity report, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }
  /audit/export:
    get:
      summary: Export records and a full-chain verification witness
      parameters:
        - { $ref: '#/components/parameters/actorId' }
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
      responses:
        '200': { description: Verifiable export bundle }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /audit/export/verify:
    post:
      summary: Verify a self-contained audit export bundle without database access
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportBundle' }
      responses:
        '200': { description: Offline export verification result, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationResult' } } } }
  /audit/events/{eventId}/redactions:
    post:
      summary: Redact previously declared sensitive payload paths
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths, actorId, reason]
              properties:
                paths: { type: array, minItems: 1, items: { type: string } }
                actorId: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Redacted event, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEvent' } } } }
  /audit/retention/run:
    post:
      summary: Soft-archive non-archived records before an optional cutoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cutoff: { type: string, format: date-time }
                policy: { type: string }
      responses:
        '200': { description: Archive result }
  /audit/reports/client-account-access:
    get:
      summary: Constrained report of client-account access events
      parameters:
        - { name: clientAccountId, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
      responses:
        '200': { description: Client account access report }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    actorId: { name: actorId, in: query, schema: { type: string } }
    resourceType: { name: resourceType, in: query, schema: { type: string } }
    resourceId: { name: resourceId, in: query, schema: { type: string } }
    eventType: { name: eventType, in: query, schema: { type: string } }
    from: { name: from, in: query, schema: { type: string, format: date-time } }
    to: { name: to, in: query, schema: { type: string, format: date-time } }
  responses:
    InvalidRequest:
      description: Validation failure
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    AppendEventRequest:
      type: object
      additionalProperties: false
      required: [eventType, actorId, resourceType, resourceId, payload]
      properties:
        eventType: { type: string, minLength: 1 }
        actorId: { type: string, minLength: 1 }
        resourceType: { type: string, minLength: 1 }
        resourceId: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
        sensitivePaths: { type: array, items: { type: string }, uniqueItems: true }
    AuditEvent:
      allOf:
        - $ref: '#/components/schemas/AppendEventRequest'
        - type: object
          required: [sequence, eventId, recordedAt, previousHash, contentHash, status]
          properties:
            sequence: { type: integer, minimum: 1 }
            eventId: { type: string, format: uuid }
            recordedAt: { type: string, format: date-time }
            previousHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            status: { type: string, enum: [ACTIVE, REDACTED, ARCHIVED] }
    EventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: [string, 'null'] }
    ExportBundle:
      type: object
      required: [formatVersion, hashAlgorithm, hashVersion, records, chainWitnesses]
      properties:
        formatVersion: { type: string, const: audit-export-v1 }
        hashAlgorithm: { type: string, const: SHA-256 }
        hashVersion: { type: string, const: v1 }
        records: { type: array }
        chainWitnesses: { type: array }
    VerificationResult:
      type: object
      required: [intact, recordsChecked, firstViolation]
      properties:
        intact: { type: boolean }
        recordsChecked: { type: integer, minimum: 0 }
        firstViolation:
          oneOf:
            - type: 'null'
            - type: object
              required: [sequence, eventId, type]
              properties:
                sequence: { type: integer }
                eventId: { type: string, format: uuid }
                type: { type: string, enum: [PREVIOUS_HASH_MISMATCH, CONTENT_HASH_MISMATCH, SENSITIVE_VALUE_COMMITMENT_MISMATCH, CHAIN_HEAD_MISSING, CHAIN_HEAD_MISMATCH, CHAIN_HEAD_SIGNATURE_MISSING, CHAIN_HEAD_SIGNATURE_MISMATCH] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
