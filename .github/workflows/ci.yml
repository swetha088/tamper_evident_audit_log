name: Build and dependency review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            target/*.cdx.json
            target/classes/META-INF/sbom/*.json
            target/site/jacoco/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: audit_log
          MYSQL_USER: audit_test
          MYSQL_PASSWORD: audit_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode -Dtest=MySqlAuditIntegrationTest test
        env:
          RUN_MYSQL_INTEGRATION: "true"
          AUDIT_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/audit_log?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          AUDIT_TEST_DB_USERNAME: audit_test
          AUDIT_TEST_DB_PASSWORD: audit_test_password
